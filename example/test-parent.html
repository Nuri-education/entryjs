<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>Entry WS — postMessage 통신 테스트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; display: flex; flex-direction: column; height: 100vh; }

        #toolbar {
            display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
            background: #1e1e2e; border-bottom: 1px solid #444;
        }
        button {
            padding: 6px 14px; border: 1px solid #666; border-radius: 4px;
            background: #313244; color: #cdd6f4; cursor: pointer; font-size: 13px;
        }
        button:hover { background: #45475a; }
        button.success { border-color: #a6e3a1; color: #a6e3a1; }
        button.danger  { border-color: #f38ba8; color: #f38ba8; }

        #main { display: flex; flex: 1; overflow: hidden; }

        #iframe-container { flex: 1; }
        iframe { width: 100%; height: 100%; border: none; }

        #log-panel {
            width: 360px; display: flex; flex-direction: column;
            border-left: 1px solid #444; background: #181825;
        }
        #log-header {
            padding: 8px 12px; background: #1e1e2e;
            color: #cdd6f4; font-size: 12px; border-bottom: 1px solid #444;
            display: flex; justify-content: space-between; align-items: center;
        }
        #log-header button { font-size: 11px; padding: 2px 8px; }
        #log { flex: 1; overflow-y: auto; padding: 8px; font-size: 12px; }
        .log-entry { margin-bottom: 6px; padding: 4px 6px; border-radius: 3px; line-height: 1.5; }
        .log-entry.recv  { background: #1e3a2f; color: #a6e3a1; }
        .log-entry.send  { background: #2a1f3d; color: #cba6f7; }
        .log-entry.error { background: #3d1f1f; color: #f38ba8; }
        .log-entry.info  { background: #1e2a3d; color: #89b4fa; }
        .log-time { color: #6c7086; font-size: 10px; }

        #status-bar {
            padding: 6px 12px; background: #1e1e2e; border-top: 1px solid #444;
            font-size: 12px; color: #6c7086;
        }
        #status-bar span { margin-right: 16px; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
        .dot.green  { background: #a6e3a1; }
        .dot.grey   { background: #6c7086; }
        .dot.yellow { background: #f9e2af; }
    </style>
</head>
<body>

<div id="toolbar">
    <button onclick="sendSaveRequest()" class="success">💾 SAVE_REQUEST</button>
    <button onclick="sendLoadProject()">📂 LOAD_PROJECT</button>
    <button onclick="sendResetProject()">🔄 RESET_PROJECT</button>
    <button onclick="sendResetBlank()" class="danger">🗑 RESET (빈 프로젝트)</button>
    <span style="color:#6c7086; font-size:12px; padding: 6px 4px;">
        iframe: <code id="iframe-url" style="color:#89b4fa">http://localhost:8080</code>
    </span>
</div>

<div id="main">
    <div id="iframe-container">
        <iframe id="entry-frame" src="http://localhost:8080" allow="microphone; camera"></iframe>
    </div>

    <div id="log-panel">
        <div id="log-header">
            메시지 로그
            <button onclick="clearLog()">지우기</button>
        </div>
        <div id="log"></div>
        <div id="status-bar">
            <span><span class="dot" id="ready-dot" style="background:#6c7086"></span>WORKSPACE</span>
            <span id="save-count">저장: 0회</span>
            <span id="autosave-count">자동저장: 0회</span>
        </div>
    </div>
</div>

<script>
    var savedProjectJson = null;
    var saveCount = 0;
    var autosaveCount = 0;
    var iframeOrigin = 'http://localhost:8080';

    var frame = document.getElementById('entry-frame');

    // ── 메시지 수신 ──────────────────────────────────────────
    window.addEventListener('message', function(event) {
        var msg = event.data;
        if (!msg || !msg.type) return;

        switch (msg.type) {

            case 'WORKSPACE_READY':
                log('recv', 'WORKSPACE_READY — 워크스페이스 준비 완료');
                document.getElementById('ready-dot').className = 'dot green';
                break;

            case 'SAVE_RESPONSE':
                saveCount++;
                savedProjectJson = msg.data.projectJson;
                var objCount = (savedProjectJson.objects || []).length;
                log('recv', 'SAVE_RESPONSE — 오브젝트 ' + objCount + '개 (저장 #' + saveCount + ')');
                document.getElementById('save-count').textContent = '저장: ' + saveCount + '회';
                break;

            case 'AUTO_SAVE':
                autosaveCount++;
                var objCount2 = ((msg.data.projectJson || {}).objects || []).length;
                log('recv', 'AUTO_SAVE #' + autosaveCount + ' — 오브젝트 ' + objCount2 + '개');
                document.getElementById('autosave-count').textContent = '자동저장: ' + autosaveCount + '회';
                break;

            case 'PROJECT_LOADED':
                log('recv', 'PROJECT_LOADED — 프로젝트 로드/리셋 완료');
                break;

            case 'ERROR':
                log('error', 'ERROR — ' + (msg.data && msg.data.message));
                break;

            default:
                log('info', '알 수 없는 타입: ' + msg.type);
        }
    });

    // ── 메시지 전송 ──────────────────────────────────────────
    function postToFrame(payload) {
        frame.contentWindow.postMessage(payload, iframeOrigin);
    }

    function sendSaveRequest() {
        log('send', 'SAVE_REQUEST 전송');
        postToFrame({ type: 'SAVE_REQUEST' });
    }

    function sendLoadProject() {
        if (!savedProjectJson) {
            log('error', '저장된 프로젝트 없음 — 먼저 SAVE_REQUEST를 실행하세요');
            return;
        }
        log('send', 'LOAD_PROJECT 전송 (마지막 저장본)');
        postToFrame({ type: 'LOAD_PROJECT', data: { projectJson: savedProjectJson } });
    }

    function sendResetProject() {
        if (!savedProjectJson) {
            log('error', '저장된 프로젝트 없음 — 먼저 SAVE_REQUEST를 실행하세요');
            return;
        }
        log('send', 'RESET_PROJECT 전송 (마지막 저장본으로 리셋)');
        postToFrame({ type: 'RESET_PROJECT', data: { projectJson: savedProjectJson } });
    }

    function sendResetBlank() {
        log('send', 'RESET_PROJECT 전송 (빈 프로젝트)');
        postToFrame({ type: 'RESET_PROJECT', data: {} });
    }

    // ── 로그 유틸 ─────────────────────────────────────────────
    function log(type, text) {
        var panel = document.getElementById('log');
        var el = document.createElement('div');
        el.className = 'log-entry ' + type;
        var now = new Date();
        var time = now.toTimeString().slice(0, 8);
        el.innerHTML = '<span class="log-time">' + time + '</span> ' + escapeHtml(text);
        panel.appendChild(el);
        panel.scrollTop = panel.scrollHeight;
    }

    function clearLog() {
        document.getElementById('log').innerHTML = '';
    }

    function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    log('info', '테스트 페이지 로드 완료 — WORKSPACE_READY 대기 중...');
</script>
</body>
</html>
